name: Keep Streamlit App Awake

on:
  schedule:
    # Runs at 08:00 UTC every Monday and Thursday
    - cron: '0  */6 * * *'
  workflow_dispatch:

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Streamlit URL
        run: curl -sL -c cookies.txt -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" https://cnbxbsxr7ezak5cyfe4c5e.streamlit.app/ > /dev/null
